services:
  mysql:
    image: mysql:8.0
    container_name: tixo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tixo_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tixo_db}
    ports:
      - "3306:3306"
    volumes:
      - tixo_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tixo-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tixo_root_password}
      DB_NAME: ${MYSQL_DATABASE:-tixo_db}
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
    ports:
      - "50051:50051"
    depends_on:
      mysql:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: tixo-envoy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - backend

volumes:
  tixo_mysql_data:
